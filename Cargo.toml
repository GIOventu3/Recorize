[package]
name = "recorize"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Immutable file recovery and Arch/CachyOS system repair"
readme = "README.md"
categories = ["command-line-utilities", "os"]

[[bin]]
name = "recorize"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
filetime = "0.2"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
toml = "0.8"
walkdir = "2"
